# 103 DiTech: builds the BigCapital server image from ditech/main on Linux
# (the repo has both modules/EE and modules/ee, which case-insensitive
# macOS checkouts merge) and publishes it to GHCR for the cells to pull.
name: DiTech server image

on:
  push:
    branches: [ditech/main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ditech-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bigcapital-server
          tags: |
            type=raw,value=ditech-main
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check the image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/bigcapital-server:ditech-main
          docker pull "$IMAGE"
          # Guards against a truncated build (main.js once came out empty).
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -s packages/server/dist/main.js && test -s packages/server/dist/modules/DiTech/DiTech.module.js && echo image ok'
